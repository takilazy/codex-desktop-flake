name: Update Codex Desktop

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-codex-desktop
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for a new package
        run: python3 scripts/update-package.py

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Validate flake
        run: NIXPKGS_ALLOW_UNFREE=1 nix flake check --no-build --impure

      - name: Commit update
        run: |
          if git diff --quiet -- flake.nix; then
            echo "Codex Desktop is already up to date."
            exit 0
          fi

          version=$(sed -n 's/^      version = "\([^"]*\)";$/\1/p' flake.nix)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "codex-desktop: update to ${version}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
